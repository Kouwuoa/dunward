[package]
name = "dunward"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = ["renderer"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[dependencies.bevy]
version = "0.18.0"
default-features = false
features = [
    "bevy_asset",
    "bevy_color",
    "bevy_gilrs",
    "bevy_image",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "custom_cursor",
    "multi_threaded",
    "std",
    "sysinfo_plugin",
    "x11",
    "debug",
]

[dependencies]
bevy_asset_loader = "0.25.0"
bevy_kira_audio = "0.25.0"
renderer = { path = "renderer" }
